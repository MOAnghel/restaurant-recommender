# Application Configuration
spring.application.name=restaurant-recommender
server.port=8080
server.servlet.context-path=/api

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_recommender
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console (for development - disable in production)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Spring AI Configuration (Gemini API)
spring.ai.gemini.api-key=${GEMINI_API_KEY:demo}

# Logging Configuration
logging.level.com.restaurant=DEBUG
logging.level.org.springframework.security=INFO

# Development Profile (uncomment to use H2 instead of PostgreSQL)
# spring.profiles.active=development